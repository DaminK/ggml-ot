name: ruff_linter

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Check code syntax and style
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Linting needs only Ruff; the full project dependencies can exhaust runner disk space.
      - name: Install Ruff
        run: python -m pip install --no-cache-dir "ruff==0.11.13"
      - name: Lint with ruff
        run: |
          ruff check --config pyproject.toml
